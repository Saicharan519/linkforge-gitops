# Values for the local kind cluster, layered on top of charts/linkforge/values.yaml.
# Only what DIFFERS from the defaults (or must be decided per environment) is stated here.
#
# The two `tag:` lines are rewritten by CI (linkforge repo, .github/workflows/build-push.yml)
# after every merge to main. It finds them by the "# ci:...-tag" markers, so do NOT remove the
# markers or change the `tag: "..."` shape of these two lines.

api:
  image:
    repository: ghcr.io/saicharan519/linkforge-api
    tag: "sha-78f5e51" # ci:api-tag
frontend:
  image:
    repository: ghcr.io/saicharan519/linkforge-frontend
    tag: "sha-78f5e51" # ci:frontend-tag

postgres:
  enabled: true # a database inside the cluster (EKS uses RDS instead)

config:
  ENV: dev # local cluster; there is no placeholder user any more, login is real (P2.6)
  SHORT_URL_BASE: http://go.localtest.me
  TRUSTED_PROXY_COUNT: "1" # exactly one proxy in front of the API: Traefik
  COOKIE_SECURE: "false" # kind is plain HTTP; a Secure cookie would never be sent back

ingress:
  className: traefik
  appHost: app.localtest.me
  goHost: go.localtest.me
