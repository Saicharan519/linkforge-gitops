# DEFAULT values: sane for any environment. An environment file (envs/kind/values.yaml) is layered
# on top and only states what differs. Anything an environment MUST decide is left empty here and
# enforced with `required` in the templates, so a forgotten value fails loudly at render time
# instead of deploying something half-configured.

api:
  image:
    repository: ghcr.io/saicharan519/linkforge-api
    tag: "" # REQUIRED. CI writes it into the env file (marker comment "ci:api-tag")
    pullPolicy: IfNotPresent # tags are commit SHAs and never re-used, so a cached image is correct
  # Fixed replica count. Used ONLY when autoscaling is off: with the HPA on, the HPA owns the count.
  replicas: 2
  resources: # budget: docs/ARCHITECTURE.md §9.3
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 384Mi}
  # HorizontalPodAutoscaler (templates/hpa.yaml). Infra rule: 70% CPU, min 2, max 6.
  autoscaling:
    enabled: true
    minReplicas: 2 # never below 2: one pod can be restarted without an outage
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70 # % of the CPU request (100m), see hpa.yaml
  # PodDisruptionBudget (templates/pdb.yaml): voluntary evictions may never leave fewer than this.
  pdb:
    enabled: true
    minAvailable: 1

# The click worker: same image as the API (it follows api.image.tag), different command.
worker:
  # Switch off to deploy the chart BEFORE the image that contains the worker exists (see
  # docs/RUNBOOK-p3-chart.md in the linkforge repo: the chart goes first, the worker is enabled last).
  enabled: true
  resources: # ARCHITECTURE §9.3: 100m / 128Mi request; it idles at about 60Mi
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

frontend:
  image:
    repository: ghcr.io/saicharan519/linkforge-frontend
    tag: "" # REQUIRED. CI writes it into the env file (marker comment "ci:frontend-tag")
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 64Mi}

migrate:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

# PostgreSQL inside the cluster. true on kind; false on EKS, where RDS is used instead.
postgres:
  enabled: true
  # Tag AND digest, like our Dockerfiles. Same version as docker-compose.yml.
  image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
  storage: 1Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

# Redis inside the cluster (sessions, rate limits, redirect cache, click stream). Runs on EKS too.
redis:
  enabled: true
  # Tag AND digest, like our Dockerfiles. Same major version as docker-compose.yml.
  image: redis:7.4@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
  storage: 1Gi
  resources: # ARCHITECTURE §9.3 / §5.1: the memory limit must exceed maxmemory (256mb) with room
    requests: {cpu: 100m, memory: 256Mi} # for the copy-on-write fork of an AOF rewrite (D11)
    limits: {cpu: 500m, memory: 512Mi}

# Prometheus integration. OFF until P8 installs kube-prometheus-stack (the ServiceMonitor kind does
# not exist before that); switch it on in the same change.
monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    releaseLabel: "" # the kube-prometheus-stack release name, if its selector needs it (decided in P8)

# Non-secret application settings; become the container environment (backend/app/config.py).
config:
  ENV: "" # REQUIRED (dev | test | prod)
  LOG_LEVEL: INFO
  SHORT_URL_BASE: "" # REQUIRED: what short links look like, e.g. http://go.localtest.me
  # How many reverse proxies of ours sit in front of the API: 1 = Traefik (kind) or the ALB (EKS).
  # Too low and every visitor shares the proxy's single rate-limit bucket; too high and clients
  # could forge their address. Hence REQUIRED, no default (core/client_ip.py in the app).
  TRUSTED_PROXY_COUNT: "" # REQUIRED
  # Comma-separated origins allowed to make state-changing requests with a session cookie (CSRF
  # check), e.g. http://app.localtest.me. Empty would allow nothing, so it is REQUIRED.
  ALLOWED_ORIGINS: "" # REQUIRED
  # Secure cookies need HTTPS. Default on; an environment without TLS (kind) must say so.
  COOKIE_SECURE: "true"
  # Only when redis.enabled=false (an external Redis): its URL. Ignored otherwise.
  REDIS_URL: ""

# The Secret holding DATABASE_URL (and POSTGRES_PASSWORD when postgres.enabled). The chart does
# NOT create it: kind = created by hand (docs/RUNBOOK-k8s-raw.md §2), later a SealedSecret.
secrets:
  existingSecret: linkforge-db

ingress:
  className: "" # REQUIRED: "traefik" on kind, "alb" on EKS
  appHost: "" # REQUIRED: web app + /api
  goHost: "" # REQUIRED: public short-link host
  annotations: {}
