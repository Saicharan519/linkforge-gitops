{{- if .Values.secrets.sealed.enabled }}
{{- /* Helm's `required` only rejects a missing or empty-STRING value, not an empty map, so test it ourselves. */}}
{{- if not .Values.secrets.sealed.encryptedData }}
{{- fail "secrets.sealed.enabled is true but secrets.sealed.encryptedData is empty: seal the secrets first (envs/<env>/sealed.values.yaml)" }}
{{- end }}
# SealedSecret (P7D): the database URL, the Postgres password and the IP-hash key, stored in git as
# CIPHERTEXT. Only the Sealed Secrets controller of THIS cluster (its private key) can decrypt it; it
# creates the ordinary Secret `{{ .Values.secrets.existingSecret }}` that the pods read. So git holds
# every secret the cluster needs, and none of them readable.
#
# `encryptedData` comes from a generated values file (envs/<env>/sealed.values.yaml, written by
# kubeseal), never typed by hand. The seal is bound to this exact name and namespace ("strict scope"):
# renaming the Secret or moving it to another namespace makes decryption fail, which stops a stolen
# ciphertext from being re-used elsewhere.
#
# Sync wave -2: before Postgres/Redis (-1), the migration (0) and the workloads (1), which all read the
# Secret. SealedSecret has no health check in Argo CD, so a pod may start a moment before the controller
# has created the Secret; Kubernetes then simply retries ("CreateContainerConfigError") and succeeds.
#
# Adopting a Secret that already exists (the hand-made one, before P7D): the controller refuses to
# overwrite a Secret it does not own, unless that Secret carries the annotation
# `sealedsecrets.bitnami.com/managed: "true"`. That was set once, by hand, on kind. A fresh cluster has
# no Secret yet, so nothing is needed there.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "linkforge.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # On a brand-new cluster the CRD is installed by the wave -3 Application a moment before this sync;
    # do not fail the dry run if Argo's CRD cache is one step behind.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  encryptedData:
    {{- toYaml .Values.secrets.sealed.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ .Values.secrets.existingSecret }}
      namespace: {{ .Release.Namespace }}
    type: Opaque
{{- end }}
