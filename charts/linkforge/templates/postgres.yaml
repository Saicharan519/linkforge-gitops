{{- if .Values.postgres.enabled }}
# PostgreSQL for kind. Switched off (postgres.enabled=false) on EKS, where RDS is used.
# Why each field is the way it is: infra/k8s-raw/10-postgres.yaml in the linkforge repo (heavily
# commented, applied by hand in P1S.4b). This template is the same object driven by values.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres
    {{- include "linkforge.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  clusterIP: None # headless: gives the StatefulSet pod a stable DNS name
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "linkforge.labels" . | nindent 4 }}
  annotations:
    # Argo waits for wave -1 to be Healthy (pod Ready) before starting wave 0 (the migration).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "linkforge.podSecurity" 999 | nindent 8 }}
        fsGroup: 999 # makes the mounted volume writable for a non-root Postgres
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: linkforge
            - name: POSTGRES_DB
              value: linkforge
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata # sub-directory: a new volume contains lost+found
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            {{- include "linkforge.containerSecurity" . | nindent 12 }}
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "linkforge", "-d", "linkforge"]
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "linkforge", "-d", "linkforge"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "linkforge", "-d", "linkforge"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
