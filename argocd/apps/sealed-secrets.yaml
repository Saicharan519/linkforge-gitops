# Child Application, wave -3: the Sealed Secrets controller and its CRD (vendored in
# platform/sealed-secrets/, see the README there). It must be Healthy BEFORE the linkforge Application
# starts, because linkforge contains a SealedSecret that only this controller can turn into the
# `linkforge-db` Secret.
#
# No `resources-finalizer`: if this Application were ever deleted, a cascade would remove the controller
# and its CRD; deleting the CRD deletes every SealedSecret and then the Secrets they created. Without the
# finalizer the controller simply keeps running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/Saicharan519/linkforge-gitops.git
    targetRevision: main
    path: platform/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system # where kubeseal expects to find the controller
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
