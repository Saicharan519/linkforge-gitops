# EKS, wave -3: the Sealed Secrets controller and its CRD (same vendored manifest as kind). On EKS it creates its OWN key
# pair on first start: the SealedSecrets sealed for kind cannot be read here, so the EKS secrets are sealed against THIS
# controller after it is up (scripts/eks-seal-and-enable.sh, P9.3). No finalizer: deleting this Application must never
# cascade into the CRD (that would delete every SealedSecret and the Secrets they created).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/Saicharan519/linkforge-gitops.git
    targetRevision: main
    path: platform/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
