# EKS, wave -3: metrics-server. The API's HorizontalPodAutoscaler (and `kubectl top`) read CPU from the metrics API, which a
# plain EKS cluster does not have. Official chart, exact version (3.14.0 = metrics-server v0.9.0; kind runs v0.9.1 from
# the release manifest). Unlike kind, no `--kubelet-insecure-tls`: EKS kubelet certificates are signed by the cluster CA.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.14.0
    helm:
      releaseName: metrics-server
      valuesObject:
        replicas: 1
        resources:
          requests: {cpu: 25m, memory: 48Mi}
          limits: {memory: 128Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
