# Teaches Argo CD how to judge the health of an `Application` resource (applied by
# linkforge/scripts/bootstrap-kind.sh right after installing Argo CD, before root.yaml).
#
# Why: Argo CD 3.6.1 has NO health check for Applications (shown with its own evaluator:
# "Health script is not configured for 'argoproj.io/Application'"). The root app-of-apps creates child
# Applications in sync-wave order and moves to the next wave only when the previous wave's objects are
# Healthy. Without this script every Application counts as Healthy the moment it is created, before it has
# synced anything, so the waves do not order anything: `linkforge` would start while the Sealed Secrets
# controller is still starting. With it, a child is Healthy only when ITS OWN status says so.
#
# This is the Lua snippet from Argo CD's own documentation (cluster bootstrapping, app of apps).
# It is a ConfigMap patch: applying it with --server-side only adds this one key to `argocd-cm` and leaves
# the rest of the installed ConfigMap alone.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
